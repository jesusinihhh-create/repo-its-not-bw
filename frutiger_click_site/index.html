<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Me!</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif}
    body{
      min-height:100vh;overflow:hidden;color:#174d35;position:relative;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.95) 0 45px,transparent 47px),
        radial-gradient(circle at 27% 17%,rgba(255,255,255,.9) 0 60px,transparent 62px),
        radial-gradient(circle at 34% 22%,rgba(255,255,255,.85) 0 42px,transparent 44px),
        linear-gradient(to bottom,#69d9ff 0%,#a7ecff 42%,#d9f8ff 55%,#82d957 56%,#42b83e 100%);
    }
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 15%,rgba(255,255,255,.65),transparent 45%);mix-blend-mode:screen}
    .hill{position:fixed;bottom:-100px;width:70vw;height:260px;border-radius:50% 50% 0 0;background:linear-gradient(#7ee35c,#35a93a);box-shadow:inset 0 18px 30px rgba(255,255,255,.25);z-index:-1}
    .hill.one{left:-20vw;transform:rotate(-4deg)}
    .hill.two{right:-20vw;bottom:-120px;transform:rotate(5deg);background:linear-gradient(#93ed66,#40b43b)}
    .sun{position:fixed;top:55px;right:80px;width:115px;height:115px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbd0,#fff36b 55%,#ffd52e);box-shadow:0 0 30px rgba(255,235,80,.8),0 0 70px rgba(255,255,180,.55)}
    .page{position:relative;width:min(850px,90%);margin:0 auto;padding-top:11vh;text-align:center}
    .window{padding:38px 45px 45px;border:3px solid rgba(255,255,255,.9);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(224,255,245,.48));box-shadow:0 20px 45px rgba(0,80,70,.25),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -8px 20px rgba(70,180,130,.12);backdrop-filter:blur(9px)}
    h1{margin:0 0 10px;font-size:clamp(38px,7vw,70px);color:#0877a8;text-shadow:0 3px 0 white,0 6px 12px rgba(0,100,130,.25);letter-spacing:1px}
    .subtitle{margin:0 auto 30px;max-width:650px;font-size:18px;line-height:1.6;color:#27614c;text-shadow:0 1px white}
    .click-button{display:inline-block;padding:22px 65px;border-radius:22px;border:3px solid rgba(255,255,255,.95);color:white;background:linear-gradient(#72eaff 0%,#18bfe9 45%,#0789ca 50%,#0573b7 100%);font-size:clamp(30px,5vw,48px);font-weight:bold;text-decoration:none;letter-spacing:2px;box-shadow:0 8px 0 #045c91,0 14px 25px rgba(0,80,120,.35),inset 0 5px 7px rgba(255,255,255,.8);text-shadow:0 3px 3px rgba(0,70,110,.5);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
    .click-button:hover{transform:translateY(-4px) scale(1.03);filter:brightness(1.08);box-shadow:0 12px 0 #045c91,0 20px 35px rgba(0,80,120,.4),inset 0 5px 8px rgba(255,255,255,.9)}
    .click-button:active{transform:translateY(5px);box-shadow:0 3px 0 #045c91,0 8px 15px rgba(0,80,120,.3),inset 0 5px 8px rgba(255,255,255,.8)}
    .render-text{margin-top:34px;padding:17px 25px;border-radius:18px;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.75);color:#285b48;font-size:16px;line-height:1.5;box-shadow:inset 0 2px 5px rgba(255,255,255,.8),0 8px 20px rgba(0,80,60,.12)}
    .bubble{position:fixed;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,rgba(255,255,255,.65) 25%,rgba(100,220,255,.25) 65%,transparent 70%);pointer-events:none}
    .b1{width:80px;height:80px;left:7%;bottom:18%}.b2{width:42px;height:42px;left:15%;bottom:31%}.b3{width:65px;height:65px;right:8%;bottom:25%}
    @media(max-width:600px){.page{padding-top:7vh}.window{padding:30px 20px}.sun{right:20px;top:25px;width:75px;height:75px}.click-button{width:100%;padding:20px 15px}}
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="hill one"></div><div class="hill two"></div>
  <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
  <main class="page">
    <section class="window">
      <h1>CLICK ME!</h1>
      <p class="subtitle">Welcome to my little corner of the internet 🌊</p>
      <a class="click-button" href="https://kick.com/jesusini01023" target="_blank" rel="noopener noreferrer">CLICK ME!</a>
      <div class="render-text">hello this is maked on render i putted the repo on render so, pls not say or a stupid word saying render slop thanks</div>
    </section>
  </main>
</body>
</html>
